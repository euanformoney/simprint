name: debug-secrets
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Step-by-step debug
        shell: powershell
        run: |
          Copy-Item "src-tauri/config.example.toml" "src-tauri/config.production.toml" -Force
          $configPath = "src-tauri/config.production.toml"
          $content = Get-Content $configPath -Raw
          Write-Output "LEN: $($content.Length)"
          Write-Output "HAS base_url: $($content.Contains('base_url'))"
          Write-Output "FIRST 60: $($content.Substring(0, [Math]::Min(60, $content.Length)))"

          $pattern = '^(base_url\s*=\s*)".*"$'
          $replacement = '$1"https://browser.aisub2api.top/api/"'
          Write-Output "PATTERN: $pattern"
          Write-Output "REPLACEMENT: $replacement"

          $newContent = [regex]::Replace($content, $pattern, $replacement, [System.Text.RegularExpressions.RegexOptions]::Multiline)
          Write-Output "AFTER REPLACE len: $($newContent.Length)"
          Write-Output "AFTER REPLACE base_url line:"
          $newContent -split "`n" | Where-Object { $_ -match 'base_url' } | ForEach-Object { Write-Output "  $_" }
