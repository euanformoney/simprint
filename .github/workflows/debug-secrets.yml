name: debug-secrets
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Test inline replace
        shell: powershell
        run: |
          Copy-Item "src-tauri/config.example.toml" "src-tauri/config.production.toml" -Force
          $configPath = "src-tauri/config.production.toml"
          $content = Get-Content $configPath -Raw

          $content = $content -replace '^(base_url\s*=\s*)".*"$', '$1"https://browser.aisub2api.top/api/"'
          $content = $content -replace '^(check_url\s*=\s*)".*"$', '$1"http://192.227.221.236:40042/api/v1/versions/check"'

          [System.IO.File]::WriteAllText((Resolve-Path $configPath).Path, $content, (New-Object System.Text.UTF8Encoding($false)))
          Write-Output "=== RESULT ==="
          Get-Content $configPath | Select-String "base_url|check_url"
