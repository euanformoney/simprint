name: debug-secrets
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Test return-value approach
        shell: powershell
        run: |
          Copy-Item "src-tauri/config.example.toml" "src-tauri/config.production.toml" -Force
          $configPath = "src-tauri/config.production.toml"
          $content = Get-Content $configPath -Raw

          function Set-ConfigValue {
            param(
              [string]$Pattern,
              [string]$Value,
              [string]$Source
            )
            if ([string]::IsNullOrWhiteSpace($Value)) { return $Source }
            $escapedValue = $Value.Replace('\', '\\').Replace('"', '\"')
            return [regex]::Replace(
              $Source,
              $Pattern,
              ('$1"{0}"' -f $escapedValue),
              [System.Text.RegularExpressions.RegexOptions]::Multiline
            )
          }

          $content = Set-ConfigValue '^(base_url\s*=\s*)".*"$' "https://browser.aisub2api.top/api/" $content
          $content = Set-ConfigValue '^(check_url\s*=\s*)".*"$' "http://192.227.221.236:40042/api/v1/versions/check" $content

          [System.IO.File]::WriteAllText((Resolve-Path $configPath).Path, $content, (New-Object System.Text.UTF8Encoding($false)))
          Write-Output "=== RESULT ==="
          Get-Content $configPath | Select-String "base_url|check_url"
