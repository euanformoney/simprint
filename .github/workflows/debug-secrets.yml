name: debug-secrets
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Test secret injection
        shell: powershell
        env:
          APP_SERVER_BASE_URL: ${{ secrets.APP_SERVER_BASE_URL }}
        run: |
          Copy-Item "src-tauri/config.example.toml" "src-tauri/config.production.toml" -Force
          $configPath = "src-tauri/config.production.toml"
          $content = Get-Content $configPath -Raw

          function Set-ConfigValue {
            param(
              [string]$Pattern,
              [string]$Value
            )
            if ([string]::IsNullOrWhiteSpace($Value)) { return }
            $escapedValue = $Value.Replace('\', '\\').Replace('"', '\"')
            $script:content = [regex]::Replace(
              $script:content,
              $Pattern,
              ('$1"{0}"' -f $escapedValue),
              [System.Text.RegularExpressions.RegexOptions]::Multiline
            )
          }

          Write-Output "=== STEP 1: HARDCODED value ==="
          Set-ConfigValue '^(base_url\s*=\s*)".*"$' "https://hardcoded.example.com/api/"
          [System.IO.File]::WriteAllText((Resolve-Path $configPath).Path, $content, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content $configPath | Select-String "base_url"

          Write-Output "=== STEP 2: SECRET value ==="
          $content2 = Get-Content $configPath -Raw
          Set-ConfigValue '^(base_url\s*=\s*)".*"$' "${{ env.APP_SERVER_BASE_URL }}"
          [System.IO.File]::WriteAllText((Resolve-Path $configPath).Path, $content, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content $configPath | Select-String "base_url"
