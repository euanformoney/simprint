name: debug-secrets
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Dump content
        shell: powershell
        run: |
          Copy-Item "src-tauri/config.example.toml" "src-tauri/config.production.toml" -Force
          $configPath = "src-tauri/config.production.toml"
          $content = Get-Content $configPath -Raw
          Write-Output "=== ORIGINAL (first 200) ==="
          Write-Output $content.Substring(0, 200)
          Write-Output "=== bytes of base_url line ==="
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $configPath).Path)
          Write-Output "Total bytes: $($bytes.Length)"
          Write-Output "First bytes: $($bytes[0..30] -join ',')"
