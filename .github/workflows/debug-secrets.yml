name: debug-secrets
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Final test with secrets
        shell: powershell
        env:
          APP_SERVER_BASE_URL: ${{ secrets.APP_SERVER_BASE_URL }}
          APP_SERVER_VERSION: ${{ secrets.APP_SERVER_VERSION }}
          APP_SERVER_SECRET_KEY: ${{ secrets.APP_SERVER_SECRET_KEY }}
          APP_UPDATER_CHECK_URL: ${{ secrets.APP_UPDATER_CHECK_URL }}
          APP_UPDATER_LATEST_JSON_URL: ${{ secrets.APP_UPDATER_LATEST_JSON_URL }}
          APP_RUNTIME_LATEST_JSON_URL: ${{ secrets.APP_RUNTIME_LATEST_JSON_URL }}
          APP_UPDATER_TEMP_DIR: ${{ secrets.APP_UPDATER_TEMP_DIR }}
        run: |
          Copy-Item "src-tauri/config.example.toml" "src-tauri/config.production.toml" -Force
          $configPath = "src-tauri/config.production.toml"
          $content = Get-Content $configPath -Raw

          function Set-ConfigValue {
            param(
              [string]$Pattern,
              [string]$Value,
              [string]$Source
            )
            if ([string]::IsNullOrWhiteSpace($Value)) { return $Source }
            $escapedValue = $Value.Replace('\', '\\').Replace('"', '\"')
            return [regex]::Replace(
              $Source,
              $Pattern,
              ('$1"{0}"' -f $escapedValue),
              [System.Text.RegularExpressions.RegexOptions]::Multiline
            )
          }

          $content = Set-ConfigValue '^(base_url\s*=\s*)".*"\r?$' "${{ env.APP_SERVER_BASE_URL }}" $content
          $content = Set-ConfigValue '^(version\s*=\s*)".*"\r?$' "${{ env.APP_SERVER_VERSION }}" $content
          $content = Set-ConfigValue '^(secret_key\s*=\s*)".*"\r?$' "${{ env.APP_SERVER_SECRET_KEY }}" $content
          $content = Set-ConfigValue '^(check_url\s*=\s*)".*"\r?$' "${{ env.APP_UPDATER_CHECK_URL }}" $content
          $content = Set-ConfigValue '^(latest_json_url\s*=\s*)".*"\r?$' "${{ env.APP_UPDATER_LATEST_JSON_URL }}" $content
          $content = Set-ConfigValue '^(runtime_latest_json_url\s*=\s*)".*"\r?$' "${{ env.APP_RUNTIME_LATEST_JSON_URL }}" $content
          $content = Set-ConfigValue '^(updater_temp_dir\s*=\s*)".*"\r?$' "${{ env.APP_UPDATER_TEMP_DIR }}" $content

          [System.IO.File]::WriteAllText((Resolve-Path $configPath).Path, $content, (New-Object System.Text.UTF8Encoding($false)))
          Write-Output "=== FINAL CONFIG ==="
          Get-Content $configPath
