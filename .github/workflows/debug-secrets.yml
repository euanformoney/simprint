name: debug-secrets
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Test CRLF-safe replace
        shell: powershell
        run: |
          Copy-Item "src-tauri/config.example.toml" "src-tauri/config.production.toml" -Force
          $configPath = "src-tauri/config.production.toml"
          $content = Get-Content $configPath -Raw
          Write-Output "HAS CRLF: $($content.Contains([char]13))"
          Write-Output "HAS LF: $($content.Contains([char]10))"

          $pattern = '^(base_url\s*=\s*)".*"\r?$'
          $replacement = '$1"https://browser.aisub2api.top/api/"'
          $newContent = [regex]::Replace($content, $pattern, $replacement, [System.Text.RegularExpressions.RegexOptions]::Multiline)
          Write-Output "NEW LEN: $($newContent.Length) (orig: $($content.Length))"
          $newContent -split "`n" | Where-Object { $_ -match 'base_url' } | ForEach-Object { Write-Output "LINE: $_" }
